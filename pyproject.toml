[project]
name = "dmac-curation"
version = "0.5.0"
requires-python = ">=3.11"
# Floors are what the PEP-723 headers already declared; uv.lock records what
# was actually resolved. The pipeline is verified deterministic on pandas 3,
# so the lock is the reproducibility guarantee, not these bounds.
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "requests>=2.31",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "smbprotocol>=1.10",
]

[dependency-groups]
dev = ["pytest>=8.0", "numpy>=1.26"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Extract-backed tests are DESELECTED BY DEFAULT. They load production dumps
# (166k samples, 802k edges, a 106MB findings.csv) and OOM-killed this machine
# twice on 2026-09-01; the suite is serial, so this was never a CPU problem.
# `tests/conftest.py` additionally blocks the reads outright, so this is the
# convenience half and that is the guarantee. Run them deliberately, on an idle
# machine, with:  uv run pytest -k "real_extract" -p no:cacheprovider
addopts = "-k 'not real_extract'"
